name: Deploy client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Игра — корень сайта; прототип 010 остаётся под /proto/010/ (011 заморожен, см. prototypes/011-net/README.md)
      - name: Build client and prototype
        run: |
          npm run build -w apps/client
          npm run build -w prototypes/010-touch
      - name: Assemble site
        run: |
          rm -rf site && mkdir -p site/proto/010
          cp -r apps/client/dist/. site/
          cp -r prototypes/010-touch/dist/. site/proto/010/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
