name: Deploy client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Прототипы (выбрасываемые) публикуются рядом с заглушкой: /proto/<id>/
      - run: npm ci
      - name: Build prototypes
        run: |
          npm run build -w prototypes/010-touch
          npm run build -w prototypes/011-net
      - name: Assemble site
        run: |
          mkdir -p site/proto/010 site/proto/011
          cp -r prototypes/010-touch/dist/. site/proto/010/
          cp -r prototypes/011-net/dist/. site/proto/011/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
